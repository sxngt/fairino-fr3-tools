[project]
name = "fr3tools"
version = "0.1.0"
description = "Unofficial tools for the FAIRINO FR3 cobot with a DH-Robotics AG-95 gripper: kinematics, safe servo streaming, ROS 2 driver, calibration"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "sxngt", email = "sxngt.dev@gmail.com" }]
requires-python = ">=3.10"
keywords = ["robotics", "fairino", "fr3", "cobot", "ros2", "moveit", "hand-eye", "ag-95"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Camera calibration and ArUco detection (fr3-camera-calib, fr3-handeye in robot mode).
# 카메라 보정과 ArUco 검출.
vision = ["opencv-python-headless>=4.8"]
# AG-95 directly over a USB-RS485 adapter (Modbus RTU). / USB-RS485 직결 AG-95.
serial = ["pyserial>=3.5"]
# ROS 2 driver and adapter (fr3-driver, fr3-probe, fr3-handeye robot mode). rclpy, sensor_msgs,
# std_msgs, std_srvs, control_msgs, trajectory_msgs and rcl_interfaces come from the ROS 2 install
# (Humble tested): source /opt/ros/humble/setup.bash. They are not on PyPI, so this extra is empty.
# ROS 2 메시지·rclpy 는 pip 가 아니라 ROS 2 설치에서 온다(Humble 검증). 이 extra 는 안내용으로 비어 있다.
ros = []
dev = ["pytest>=8.0", "ruff>=0.6", "opencv-python-headless>=4.8"]

[project.scripts]
fr3-check = "fr3tools.tools:check_main"
fr3-power = "fr3tools.tools:power_main"
fr3-errors = "fr3tools.tools:errors_main"
fr3-calib-dh = "fr3tools.tools:calib_dh_main"
fr3-probe = "fr3tools.tools:probe_main"
fr3-driver = "fr3tools.ros.driver:main"
fr3-gripper = "fr3tools.gripper:main"
fr3-camera-calib = "fr3tools.calib.camera:main"
fr3-handeye = "fr3tools.calib.run:main"
fr3-teleop = "fr3tools.teleop.run:main"

[project.urls]
Homepage = "https://github.com/sxngt/fairino-fr3-tools"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
